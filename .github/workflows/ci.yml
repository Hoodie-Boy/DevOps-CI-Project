
name: DevOps CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:

  # JOB 1: TEST
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: python -m pytest -v

  # JOB 2: BUILD
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: devops-ci-app:latest

  # JOB 3: PUBLISH
  publish:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set Lowercase Image Name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  # JOB 4: DEPLOY
  deploy:
    name: Deploy to Ubuntu VM
    runs-on: [self-hosted, linux, cd-lab]
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment: kali-lab

    concurrency:
      group: kali-lab-deploy
      cancel-in-progress: false

    permissions:
      contents: read
      packages: read

    steps:
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" |
            docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

      - name: Deploy Exact Commit
        env:
          IMAGE_VERSION: ${{ github.sha }}
        run: |
          bash "$HOME/deploy/deploy.sh" "$IMAGE_VERSION"

      - name: Verify Deployment
        run: |
          curl --fail --silent --show-error \
            http://127.0.0.1:8080/health
